<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A0E2E" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#1F0519" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0208"/>
    </radialGradient>

    <linearGradient id="gold3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="20%" stop-color="#F7E29C"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#593E05"/>
    </linearGradient>

    <filter id="shadow3d" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="30" fill="url(#bgGlow)"/>

  <!-- Outer 3D Metallic Ring -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#gold3d)" stroke-width="4" filter="url(#shadow3d)" opacity="0.9"/>
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#gold3d)" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- 3D Monogram Container -->
  <g transform="translate(150, 120) scale(2)" filter="url(#shadow3d)">
    <path d="M50 6 C74 6, 90 20, 90 48 L90 82 L50 92 L10 82 L10 48 C10 20, 26 6, 50 6 Z" 
          fill="none" stroke="url(#gold3d)" stroke-width="2.5"/>

    <path d="M50 12 L54 19 L61 14 L58 23 L66 21 L59 28 L50 24 L41 28 L34 21 L42 23 L39 14 L46 19 Z" fill="url(#gold3d)"/>

    <path d="M30 72 L30 36 C30 36 44 34 44 45 C44 54 32 54 32 54 L44 72" fill="none" stroke="url(#gold3d)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M70 72 L70 36 C70 36 56 34 56 45 C56 54 68 54 68 54 L56 72" fill="none" stroke="#E0A9AF" stroke-width="3" stroke-linecap="round"/>

    <polygon points="50,44 55,52 50,60 45,52" fill="url(#gold3d)"/>
  </g>

  <text x="250" y="415" font-family="'Cinzel', 'Playfair Display', serif" font-size="28" font-weight="700" letter-spacing="8" fill="url(#gold3d)" text-anchor="middle" filter="url(#shadow3d)">
    RIWAAYAT ROYALE
  </text>
  <text x="250" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" letter-spacing="5" fill="#E0A9AF" text-anchor="middle">
    3D HIGH-TECH MAISON
  </text>
</svg>
